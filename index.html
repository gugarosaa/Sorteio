<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio de Times (Código Único)</title>

  <style>
    /* Reset e estilo base */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 800px;
    }

    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 25px;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
    }

    label {
      margin-bottom: 8px;
      font-weight: bold;
      font-size: clamp(0.9rem, 3vw, 1rem);
    }

    textarea#nomes {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
      box-sizing: border-box;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
    }

    button#sortear-btn {
      padding: 12px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: clamp(1rem, 3vw, 1.1rem);
      transition: background-color 0.3s;
      width: 100%;
    }

    button#sortear-btn:hover {
      background-color: #218838;
    }

    /* Grade de resultado */
    .resultado-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .time {
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      font-size: clamp(0.9rem, 2.5vw, 1rem);
    }

    .time h2 {
      text-align: center;
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      font-size: clamp(1.1rem, 3vw, 1.4rem);
    }

    .time ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .time ul li {
      padding: 5px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
    }

    .time ul li:last-child {
      border-bottom: none;
    }

    /* Cores dos times */
    #time1 {
      background-color: #ffc107;
      color: #333;
    }

    #time1 h2 {
      border-bottom-color: rgba(0, 0, 0, 0.2);
    }

    #time2 {
      background-color: #007bff;
      color: white;
    }

    /* --- Responsividade para celular --- */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      .resultado-grid {
        grid-template-columns: 1fr; /* Empilha os times */
      }

      button#sortear-btn {
        font-size: 1rem;
        padding: 10px;
      }

      textarea#nomes {
        font-size: 1rem;
      }

      .time {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚽ Sorteio de Times</h1>

    <div class="input-section">
      <label for="nomes">Insira os nomes (separados por vírgula ou nova linha):</label>
      <textarea id="nomes" rows="10" placeholder="..."></textarea>
      <button id="sortear-btn">Sortear Times</button>
    </div>

    <div id="resultado" class="resultado-grid"></div>
  </div>

  <script>
    document.getElementById('sortear-btn').addEventListener('click', sortearTimes);

    function sortearTimes() {
      const textarea = document.getElementById('nomes');
      let nomes = textarea.value
        .split(/[\n,]+/)
        .map(nome => nome.trim())
        .filter(nome => nome.length > 0);

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.innerHTML = '';

      if (nomes.length === 0) {
        alert("Por favor, insira os nomes para o sorteio.");
        return;
      }

      // Embaralhar nomes
      for (let i = nomes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nomes[i], nomes[j]] = [nomes[j], nomes[i]];
      }

      const time1 = [];
      const time2 = [];

      for (let i = 0; i < nomes.length; i++) {
        (i % 2 === 0 ? time1 : time2).push(nomes[i]);
      }

      resultadoDiv.innerHTML =
        criarTimeHtml('Time 1', time1, 'time1') +
        criarTimeHtml('Time 2', time2, 'time2');
    }

    function criarTimeHtml(titulo, jogadores, id) {
      let lista = jogadores.map(j => `<li>${j}</li>`).join('');
      return `
        <div id="${id}" class="time">
          <h2>${titulo} (${jogadores.length} jogadores)</h2>
          <ul>${lista}</ul>
        </div>
      `;
    }
  </script>
</body>
</html>
